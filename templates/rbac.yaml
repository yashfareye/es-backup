{{- range $cluster := .Values.clusters }}
{{- if $cluster.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $cluster.name }}-es-restore-sa
  namespace: {{ $cluster.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-{{ $cluster.name }}-es-restore-role
  namespace: {{ $cluster.namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames:
      - {{ $cluster.kibana.deploymentName }}
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ $.Release.Name }}-{{ $cluster.name }}-es-restore-state
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $cluster.name }}-es-restore-rolebinding
  namespace: {{ $cluster.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-{{ $cluster.name }}-es-restore-sa
    namespace: {{ $cluster.namespace }}
roleRef:
  kind: Role
  name: {{ $.Release.Name }}-{{ $cluster.name }}-es-restore-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}