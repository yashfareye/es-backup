# Source: es-restore-chart/templates/job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: release-name-qa-cluster-es-restore
  namespace: qa
spec:
  activeDeadlineSeconds: 3900
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: release-name-qa-cluster-restore
    spec:
      serviceAccountName: release-name-qa-cluster-es-restore-sa
      restartPolicy: Never
      containers:
        - name: restore-orchestrator
          image: bitnami/kubectl:latest
          securityContext:
            runAsUser: 0
          command: ["/bin/bash", "/scripts/restore.sh"]
          env:
            - name: ES_HOST
              value: "http://elasticsearch-test-master.qa.svc.cluster.local:9200"
            - name: REPO_NAME
              value: "fes_es_backup"
            - name: S3_BUCKET
              value: "fes-es-backup"
            - name: BASE_PATH
              value: "int-staging-es"
            - name: S3_REGION
              value: "eu-west-2"
            - name: KIBANA
              value: "kibana-test-kibana"
            - name: NAMESPACE
              value: "qa"
            - name: STATE_CONFIGMAP
              value: "release-name-qa-cluster-es-restore-state"
            - name: CURL_TIMEOUT
              value: "60"
            - name: KIBANA_TIMEOUT
              value: "300"
            - name: ES_HEALTH_TIMEOUT
              value: "3600"
            - name: HEALTH_INTERVAL
              value: "20"
          volumeMounts:
            - name: script-volume
              mountPath: /scripts
      volumes:
        - name: script-volume
          configMap:
            name: release-name-qa-cluster-es-restore-script
            defaultMode: 0755
